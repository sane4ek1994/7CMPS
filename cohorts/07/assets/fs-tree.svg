<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="monospace" font-size="14">
  <title>Основные каталоги Linux</title>
  <desc>Корень / и пять каталогов верхнего уровня: /etc (внутри nginx/ и ssh/), /var (внутри log/), /home (внутри student/), /opt и /tmp.</desc>
  <rect width="560" height="250" fill="#ffffff"/>

  <!-- Ветки: у каждого каталога своя колонка шириной 105px, подкаталоги висят на линии от левого края блока -->
  <g fill="none" stroke="#000080" stroke-width="2" stroke-linecap="square">
    <path d="M280 46 V70 M70 70 H490 M70 70 V96 M175 70 V96 M280 70 V96 M385 70 V96 M490 70 V96"/>
    <path d="M44 128 V176 M44 152 H58 M44 176 H58"/>
    <path d="M149 128 V152 H163"/>
    <path d="M254 128 V152 H268"/>
  </g>

  <g fill="#c0c0c0" stroke="#000000">
    <rect x="248" y="14" width="64" height="32"/>
    <rect x="30" y="96" width="80" height="32"/>
    <rect x="135" y="96" width="80" height="32"/>
    <rect x="240" y="96" width="80" height="32"/>
    <rect x="345" y="96" width="80" height="32"/>
    <rect x="450" y="96" width="80" height="32"/>
  </g>

  <g fill="#000000" text-anchor="middle">
    <text x="280" y="35">/</text>
    <text x="70" y="117">/etc</text>
    <text x="175" y="117">/var</text>
    <text x="280" y="117">/home</text>
    <text x="385" y="117">/opt</text>
    <text x="490" y="117">/tmp</text>
  </g>

  <g fill="#000000">
    <text x="62" y="157">nginx/</text>
    <text x="62" y="181">ssh/</text>
    <text x="167" y="157">log/</text>
    <text x="272" y="157">student/</text>
  </g>

  <text x="280" y="236" fill="#404040" text-anchor="middle" font-size="12">Схема: DevOps Campus, CC BY-SA 4.0</text>
</svg>
